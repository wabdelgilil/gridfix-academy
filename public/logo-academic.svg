<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 430 420" width="100%" height="100%">
  <defs>
    <filter id="academic-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- GridFix Mark Base -->
  <g id="gridfix-mark">
    <!-- Blue Wrench and Outer Square Frame -->
    <path d="M 349,16 L 339,10 L 328,7 L 43,7 L 30,11 L 22,16 L 11,27 L 5,38 L 3,46 L 2,75 L 3,308 L 6,318 L 13,330 L 27,342 L 46,348 L 109,348 L 117,337 L 158,269 L 166,261 L 173,257 L 205,249 L 214,245 L 230,234 L 242,221 L 252,204 L 257,187 L 258,161 L 256,149 L 248,130 L 244,129 L 212,182 L 208,186 L 166,186 L 143,150 L 143,145 L 162,115 L 178,86 L 158,86 L 142,91 L 120,104 L 106,119 L 96,136 L 91,150 L 89,161 L 90,186 L 97,209 L 96,222 L 63,276 L 60,275 L 60,75 L 62,70 L 67,65 L 75,62 L 297,62 L 303,64 L 311,74 L 311,119 L 368,119 L 368,48 L 363,32 L 360,27 Z " fill="#1482db" fill-rule="evenodd" />

    <!-- Slate 'G' Shape -->
    <path d="M 368,173 L 279,173 L 279,183 L 276,198 L 273,207 L 262,228 L 311,229 L 311,280 L 305,289 L 299,292 L 167,293 L 133,348 L 326,348 L 341,344 L 349,339 L 362,325 L 368,307 Z " fill="#65808b" fill-rule="evenodd" />
  </g>

  <!-- Academic Mortarboard Graduation Cap -->
  <g id="academic-cap" filter="url(#academic-shadow)">
    <!-- Skull Cap Base -->
    <polygon points="280,62 344,62 338,86 286,86" fill="#0f172a" />

    <!-- Top Rhombus Board -->
    <polygon points="230,45 312,14 394,45 312,76" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" />
    <polygon points="238,45 312,18 386,45 312,72" fill="none" stroke="#475569" stroke-width="1.5" />

    <!-- Golden Center Button -->
    <circle cx="312" cy="45" r="5.5" fill="#f59e0b" />

    <!-- Golden Tassel String -->
    <path d="M 312,45 Q 352,58 368,88" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />

    <!-- Golden Tassel Brush -->
    <polygon points="362,86 374,87 379,114 359,114" fill="#f59e0b" />
    <circle cx="368" cy="87" r="3" fill="#d97706" />
  </g>
</svg>